name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Guru-Surya-Raja-J
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%230C4A6E&color_dots=%23ebedf0,%237dd3fc,%2338bdf8,%230ea5e9,%230c4a6e
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2338BDF8&color_dots=%230D1117,%230c4a6e,%230ea5e9,%2338bdf8,%237dd3fc

      - name: Push snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
